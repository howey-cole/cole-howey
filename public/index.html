<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Hidden from search engines until launch. Remove this line and edit robots.txt to go public. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Cole Howey — Analytics and decision science</title>
  <meta name="description" content="Cole Howey: analytics and decision science leader. Ask the site's AI assistant about his work, education and projects.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <button id="menu-toggle" class="menu-toggle" type="button" aria-controls="menu" aria-expanded="false" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <aside id="menu" class="menu" aria-label="Site menu">
    <nav id="nav"></nav>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <main id="main">
    <section id="top" class="band band-chat">
      <div class="band-inner">
        <header class="site-header">
          <h1><a href="#top">Cole Howey</a></h1>
          <p class="tagline">Analytics &amp; Decision Science · MBA, Carnegie Mellon · MS Applied Data Science candidate, UChicago</p>
        </header>

        <div id="thread" class="thread" aria-live="polite" hidden></div>

        <form id="composer" class="composer" autocomplete="off">
          <label class="visually-hidden" for="question">Your question</label>
          <textarea id="question" rows="1" maxlength="1000" placeholder="Ask a question about Cole"></textarea>
          <button type="submit" id="send">Send</button>
        </form>
        <div id="suggestions" class="suggestions" aria-label="Suggested questions"></div>
        <p class="disclaimer">Answers come from an AI assistant and can contain errors.</p>
      </div>
    </section>

    <div id="bands"></div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
