<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Hidden from search engines until launch. Remove this line and edit robots.txt to go public. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Cole Howey — Analytics and decision science</title>
  <meta name="description" content="Cole Howey: analytics and decision science leader. Ask the site's AI assistant about his work, education and projects.">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="menu-toggle" class="menu-toggle" type="button" aria-controls="nav" aria-expanded="false">Menu</button>
      <nav id="nav" class="nav" aria-label="Sections"></nav>
      <div class="social">
        <a id="link-linkedin" class="icon-button" target="_blank" rel="noopener" aria-label="Cole Howey on LinkedIn (opens in a new tab)" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <rect x="2.5" y="2.5" width="19" height="19" rx="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <rect x="6.6" y="10" width="2.3" height="7.5" fill="currentColor"/>
            <circle cx="7.75" cy="7.1" r="1.35" fill="currentColor"/>
            <path d="M11 10h2.2v1.1c.5-.8 1.4-1.3 2.6-1.3 2 0 3 1.2 3 3.6v4.1h-2.3v-3.8c0-1.2-.4-1.8-1.4-1.8s-1.8.7-1.8 1.9v3.7H11z" fill="currentColor"/>
          </svg>
        </a>
        <a id="link-github" class="icon-button" target="_blank" rel="noopener" aria-label="Cole Howey on GitHub (opens in a new tab)" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M9 19.5c-4 1.2-4-2-5.6-2.4M14.6 21.5v-3.3c0-1 .1-1.4-.5-2 2.6-.3 5.3-1.3 5.3-5.8 0-1.2-.4-2.3-1.2-3.1.4-1 .3-2.2-.1-3.2 0 0-1-.3-3.2 1.2a11 11 0 0 0-5.8 0C6.9 3.8 5.9 4.1 5.9 4.1c-.4 1-.5 2.2-.1 3.2-.8.8-1.2 1.9-1.2 3.1 0 4.5 2.7 5.5 5.3 5.8-.6.6-.6 1.2-.5 2v3.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
  </header>

  <main id="main">
    <section id="top" class="band band-chat" aria-label="Ask about Cole">
      <div class="band-inner">
        <div class="site-header">
          <h1><a href="#top">Cole Howey</a></h1>
          <p class="tagline">Analytics &amp; Decision Science · MBA, Carnegie Mellon · MS Applied Data Science candidate, UChicago</p>
        </div>

        <div id="thread" class="thread" aria-live="polite" hidden></div>

        <form id="composer" class="composer" autocomplete="off">
          <label class="visually-hidden" for="question">Your question</label>
          <textarea id="question" rows="1" maxlength="1000" placeholder="Ask a question about Cole"></textarea>
          <button type="submit" id="send">Send</button>
        </form>
        <div id="suggestions" class="suggestions" aria-label="Suggested questions"></div>
        <p class="disclaimer">Answers come from an AI assistant and can contain errors.</p>
      </div>
    </section>

    <div id="bands"></div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
